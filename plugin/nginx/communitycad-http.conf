# CommunityCAD: Mainsail injection, http context. Managed by communitycad install.sh.
# sub_filter skips any pair whose search string evaluates to "", so these maps limit
# the rewrite to exactly two responses: Mainsail's index.html and its service worker.
# Every other response (JS bundles, API, webcams) passes through untouched.
map $uri $ccad_index_match {
    /index.html '</head>';
    default     '';
}

map $uri $ccad_sw_match {
    /sw.js  '{url:"index.html",revision:"';
    default '';
}
